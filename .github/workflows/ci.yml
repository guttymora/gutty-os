name: CI

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    workflow_dispatch:

# A new push to the same PR cancels the run still in progress
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

# Actions are pinned to commit SHAs (tag in the comment), like our dependencies
jobs:
    checks:
        name: Lint, types and unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Uses the pnpm version from package.json "packageManager"
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run prettier:check
            - run: pnpm run lint
            - run: pnpm run typecheck
            # Unit tests with the coverage thresholds
            - run: pnpm run test:coverage

    e2e:
        name: E2E MacOS
        needs: checks
        runs-on: macos-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: pnpm
            # Electron's binary (~100 MB) is downloaded once per version
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/Library/Caches/electron
                  key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: electron-${{ runner.os }}-
            - run: pnpm install --frozen-lockfile
            # Package the app and check the packaged build renders
            - run: pnpm run build:check
            - run: pnpm run test:e2e
            - name: Upload Playwright results
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-results
                  path: test-results/
                  retention-days: 7
